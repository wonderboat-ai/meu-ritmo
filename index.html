  <style>:root {
  color-scheme: light;
  --bg: #F5F8FF; --ink: #101C36; --accent: #1548B8; --on-accent: #FFF;
  --focus: #822769; --paper: #FFFFFF; --wash: #E9F0FE; --line: #C5D2EA;
  --edge: #627497; --soft: #485973; --selection: #E0EAFF;
  --signal-blue: #2D6BFF; --signal-yellow: #FFB522; --signal-red: #F04459; --signal-green: #00BD88;
  --signal-gradient: linear-gradient(90deg, var(--signal-blue), var(--signal-yellow), var(--signal-red), var(--signal-green));
  --grid-line: rgb(37 87 166 / .07); --home-halo: rgb(73 137 236 / .12);
  --soft-shadow: 0 .7rem 2rem rgb(32 64 128 / .08);
  --rhythm: 1.55; --tracking: normal; --word-gap: normal;
  font: 112.5%/var(--rhythm) system-ui, "Segoe UI", sans-serif;
  scroll-padding: 1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]), :root[data-tema="sistema"] {
    color-scheme: dark;
    --bg: #090F21; --ink: #EFF4FF; --accent: #91CEFF; --on-accent: #07162D;
    --focus: #FFE36C; --paper: #111C32; --wash: #192A46; --line: #394F73;
    --edge: #8096BD; --soft: #B4C4DE; --selection: #1D365A;
    --grid-line: rgb(138 194 255 / .08); --home-halo: rgb(40 104 213 / .18);
    --soft-shadow: 0 .7rem 2rem rgb(0 0 0 / .2);
  }
}
:root[data-tema="escuro"] {
  color-scheme: dark;
  --bg: #090F21; --ink: #EFF4FF; --accent: #91CEFF; --on-accent: #07162D;
  --focus: #FFE36C; --paper: #111C32; --wash: #192A46; --line: #394F73;
  --edge: #8096BD; --soft: #B4C4DE; --selection: #1D365A;
  --grid-line: rgb(138 194 255 / .08); --home-halo: rgb(40 104 213 / .18);
  --soft-shadow: 0 .7rem 2rem rgb(0 0 0 / .2);
}
:root[data-tema="contraste"] {
  color-scheme: dark;
  --bg: #101010; --ink: #FFF; --accent: #FFF; --on-accent: #101010;
  --focus: #FFDE70; --paper: #101010; --wash: #101010; --line: #FFF;
  --edge: #FFF; --soft: #FFF; --selection: #101010;
  --signal-gradient: linear-gradient(var(--ink), var(--ink));
  --grid-line: transparent; --home-halo: transparent; --soft-shadow: none;
}
:root[data-tamanho="grande"] {font-size: 137.5%}
:root[data-tamanho="maior"] {font-size: 162.5%}
:root[data-espacamento="amplo"] {--rhythm: 1.84; --tracking: .035em; --word-gap: .08em}
* {box-sizing: border-box}
body {
  margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--ink);
  letter-spacing: var(--tracking); word-spacing: var(--word-gap); overflow-wrap: break-word;
  display: flex; flex-direction: column;
}
:where(main, section, article, div, label) {min-width: 0}
main {flex: 1}
[hidden] {display: none !important}
button, select, input {font: inherit; letter-spacing: inherit; word-spacing: inherit}
button {color: inherit; cursor: pointer; white-space: normal; max-width: 100%; line-height: 1.35}
button:disabled {cursor: default; background: var(--wash); color: var(--soft); border-color: var(--edge); border-style: dashed}
a {color: var(--accent)}
a, .text-button, .button-link, .nav-link {text-decoration: underline; text-underline-offset: .22em; text-decoration-thickness: 1px}
:where(a, button, input, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--focus); outline-offset: 3px;
  box-shadow: 0 0 0 3px var(--bg); scroll-margin: 1rem;
}
:where(h1, h2, main)[tabindex="-1"]:focus {outline: none}
:where(h1,h2)[data-page-focus]:focus-visible {outline: 2px solid var(--focus); outline-offset: 5px}
button, summary, .source-list a, .choices label, .check-pref, .answer-row, .flow-check {min-height: 44px}
button, .source-list a, .choices label {min-width: 44px}
button, label, summary {touch-action: manipulation}
.frame {width: min(calc(100% - clamp(2.4rem, 8vw, 8rem)), 69rem); margin-inline: auto}
.skip {position: fixed; z-index: 5; top: 8px; left: 8px; padding: .65rem 1rem; border-radius: .4rem; background: var(--paper); transform: translateY(-180%)}
.skip:focus {transform: none}
.sr-only {position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0}
p {margin: 0 0 1rem; max-width: 62ch}
h1, h2, h3 {line-height: 1.17; overflow-wrap: anywhere}
h1, h2 {font-family: system-ui, "Segoe UI", sans-serif; font-weight: 640; letter-spacing: -.046em}
h3 {font-size: 1.16rem}
h1 {margin: 0 0 1.1rem; font-size: clamp(2.05rem, 4.1vw, 3.3rem)}
h2 {margin: 1.8rem 0 .75rem; font-size: clamp(1.55rem, 3vw, 2.15rem)}
.site-header {border-bottom: 1px solid var(--line); background: var(--paper)}
.header-inner {display: flex; align-items: center; gap: 1.85rem; flex-wrap: wrap; padding-block: .83rem}
.brand, .nav-link, .text-button, .button-link, .close {border: 0; background: none; padding: 0}
.brand {display: inline-flex; align-items: center; gap: .45rem; margin-right: auto; color: var(--ink); text-align: left}
.brand img {flex: none; width: 2.45rem; height: auto}
.brand span, .footer-brand {font: 730 1.58rem/1 system-ui, sans-serif; letter-spacing: -.06em}
.header-inner nav {display: flex; flex-wrap: wrap; gap: 1.55rem; align-items: center}
.nav-link {font-size: .92rem; text-align: left; text-decoration-color: var(--edge)}
.nav-link[aria-current] {font-weight: 650; text-decoration-thickness: 2px; text-decoration-color: var(--accent); color: var(--accent)}
.settings-trigger, .button-primary, .button-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .66rem 1.05rem; font-weight: 650; border-radius: .55rem; border: 1px solid var(--edge);
}
.settings-trigger, .button-secondary {background: transparent; color: var(--accent)}
.settings-trigger {font-size: .9rem; padding: .48rem .86rem; border-radius: .65rem}
.type-icon {font: 600 1.04rem/1 system-ui, sans-serif; letter-spacing: -.065em}
.button-primary {background: var(--accent); color: var(--on-accent); border-color: var(--accent)}
.button-primary:not(:disabled):hover {text-decoration: underline; text-underline-offset: .2em}
.button-secondary:hover, .settings-trigger:hover {background: var(--wash)}
.text-button, .button-link {color: var(--accent); font-weight: 600; text-align: left}
.home {position: relative}
main:has(.home) {position: relative; isolation: isolate}
main:has(.home)::before {
  content: ""; position: absolute; z-index: -1; inset: 0 0 auto; height: min(49rem, 100%);
  background:
    linear-gradient(to bottom, transparent 2rem, var(--bg)),
    radial-gradient(ellipse at 76% 14%, var(--home-halo), transparent 62%),
    repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 3.1rem),
    repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 3.1rem);
  pointer-events: none;
}
.hero {
  display: grid; grid-template-columns: minmax(0,.92fr) minmax(0,1.08fr); align-items: center;
  gap: clamp(1.9rem,4.5vw,4.25rem); padding: clamp(2.3rem,5.3vw,4.8rem) 0 clamp(2.35rem,4.2vw,3.9rem);
}
.eyebrow {
  display: flex; align-items: center; gap: .65rem; color: var(--accent); font-size: .82rem;
  line-height: 1.5; font-weight: 730; letter-spacing: var(--tracking); margin: 0 0 .92rem;
}
.eyebrow::before {content: ""; width: 1.9rem; height: 3px; background: var(--signal-gradient); border-radius: 2px; flex: none}
.hero h1 {
  font-size: clamp(2.55rem,5.45vw,4.75rem); line-height: 1.02; letter-spacing: -.067em;
  font-weight: 740; margin: 0 0 1.2rem; overflow-wrap: normal;
}
.hero h1 em {font-style: normal; color: var(--accent); font-weight: inherit}
.hero-description {max-width: 43ch; color: var(--soft); line-height: var(--rhythm); margin-bottom: 1.48rem}
.hero-actions, .flow-actions, .dialog-foot {display: flex; align-items: center; flex-wrap: wrap; gap: .68rem 1.07rem}
.hero-actions .button-primary {padding: .76rem 1.65rem; border-radius: .65rem; box-shadow: var(--soft-shadow)}
.hero-actions .button-primary:focus-visible {box-shadow: 0 0 0 3px var(--bg)}
.hero-actions .text-button {font-size: .9rem}
.hero-art {position: relative}
.hero-art > [data-voltar-da-pausa] {margin-bottom: .7rem}
.how {border-top: 1px solid var(--line); padding: 1.7rem 0 2.6rem}
.how h2 {font-size: 1.7rem; margin: 0 0 1.12rem}
.overview {margin: 0; padding: 0; list-style: none; display: grid; gap: 1rem; grid-template-columns: repeat(3,minmax(0,1fr))}
.overview li {
  --tile-color: var(--signal-blue);
  min-width: 0; overflow-wrap: anywhere; display: flex; align-items: flex-start; gap: .85rem;
  padding: 1.23rem 1.05rem; border: 1px solid var(--line); background: var(--paper);
  border-radius: .8rem; box-shadow: var(--soft-shadow);
}
.overview li:nth-child(2) {--tile-color: var(--signal-yellow)}
.overview li:nth-child(3) {--tile-color: var(--signal-green)}
.overview strong {display: block; font-weight: 660; font-size: 1.1rem; line-height: 1.3; letter-spacing: -.028em}
.overview li div span {display: block; color: var(--soft); font-size: .9rem; line-height: var(--rhythm); margin-top: .4rem}
.icon-tile {
  flex: none; width: 2.45rem; height: 2.45rem; border-radius: .62rem; display: grid; place-items: center;
  color: var(--ink); background: var(--wash);
  background: color-mix(in srgb, var(--tile-color) 17%, var(--paper));
  border: 1px solid color-mix(in srgb, var(--tile-color) 46%, var(--paper));
}
:root[data-tema="contraste"] .overview .icon-tile {background: var(--paper); color: var(--ink); border: 1px solid var(--ink)}
.home-notes {display: grid; grid-template-columns: 1.08fr 1fr; column-gap: clamp(2rem,6vw,6rem); padding-block: 2rem 2.65rem; border-top: 1px solid var(--line)}
.home-notes h2 {margin: 0 0 .75rem; font-size: 1.4rem}
.home-notes p {margin-bottom: .75rem}
.site-footer {border-top: 1px solid var(--line); color: var(--soft); background: var(--paper)}
.footer-inner {display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; padding-block: .9rem; gap: .5rem 1.3rem}
.footer-brand {font-size: 1.15rem; color: var(--ink); display: inline-flex; align-items: center; gap: .4rem}
.footer-inner > div {display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; align-items: center}
.footer-inner button {font-size: .85rem}
.reading-page, .flow-page {width: min(calc(100% - clamp(2.4rem, 8vw, 8rem)), 42rem); margin: clamp(1.8rem, 4vw, 3.4rem) auto}
.reading-page > .button-secondary {margin-bottom: 1.45rem}
.reading-page > section {border-top: 1px solid var(--line); margin-top: 1.5rem; padding-top: .15rem}
.source-list {padding-left: 1.15rem}
.source-list li + li {margin-top: .3rem}
.source-list a {display: inline-flex; align-items: center; padding-block: .3rem; overflow-wrap: anywhere}
.flow-form {margin-block: 1.3rem}
.flow-actions {margin-block: 1rem}
.flow-help {background: var(--paper); border: 1px solid var(--edge); border-radius: .55rem}
summary {cursor: pointer; color: var(--accent); font-weight: 650; padding: .7rem 1rem}
summary::marker {color: var(--accent)}
.flow-help {margin-block: 1rem}
.flow-help p {margin: .65rem 1rem 1rem}
.flow-callout {padding: .95rem 1.15rem; border-left: .24rem solid var(--accent); background: var(--wash); margin-block: 1rem}
.flow-error {background: var(--paper); border: 2px solid var(--focus); border-radius: .4rem; padding: .7rem; font-weight: 650}
.flow-question {border: none; padding: 0; margin: 0; min-width: 0}
.flow-pergunta h1 {font: 650 .96rem/1.5 system-ui, sans-serif; letter-spacing: .012em; margin: 0 0 .6rem}
.flow-progress {display: block; width: 100%; height: .55rem; appearance: none; border: 1px solid var(--edge); border-radius: .4rem; overflow: hidden; color: var(--accent); background: var(--wash); margin: 0 0 1.5rem}
.flow-progress::-webkit-progress-bar {background: var(--wash)}
.flow-progress::-webkit-progress-value {background: var(--accent)}
.flow-progress::-moz-progress-bar {background: var(--accent)}
.flow-meta {font-size: .81rem; color: var(--accent); font-weight: 700; letter-spacing: .045em; margin: 1rem 0 .5rem}
.flow-intro {font-size: .98rem; color: var(--soft); margin-bottom: .25rem}
.flow-question legend {font: 400 clamp(1.55rem, 3vw, 2.15rem)/1.25 Georgia, serif; letter-spacing: -.025em; padding: 0; max-width: 100%; margin-bottom: 1rem}
.answer-options {display: grid; gap: .45rem}
.answer-row, .flow-check, .choices label, .check-pref {display: flex; align-items: center; gap: .65rem; cursor: pointer; text-align: left}
.answer-row, .choices label {padding: .58rem .85rem; border: 1px solid var(--edge); border-radius: .52rem; background: var(--paper)}
.answer-row:has(:checked), .choices label:has(:checked) {background: var(--selection); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent)}
.answer-row:has(:focus-visible), .choices label:has(:focus-visible) {outline: 3px solid var(--focus); outline-offset: 3px}
.answer-row input, .flow-check input, .choices input, .check-pref input {accent-color: var(--accent); width: 1rem; height: 1rem; flex: none; margin: 0}
.flow-tag {margin-left: auto; color: var(--accent); font-size: .81rem; font-weight: 650}
.flow-check {width: fit-content; font-weight: 600}
.flow-counts {display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border: 1px solid var(--line); background: var(--wash); border-radius: .65rem}
.flow-counts div {display: flex; flex-direction: column-reverse; justify-content: start; padding: 1rem}
.flow-counts div + div {border-left: 1px solid var(--line)}
.flow-counts dd {margin: 0; font: 400 2.2rem/1.1 Georgia, serif; color: var(--accent)}
.flow-counts dt, .flow-subtle {color: var(--soft); font-size: .91rem}
.flow-counts dt {min-width: 0; overflow-wrap: anywhere}
.flow-list {padding-inline: 1.35rem; margin: 0 0 1rem}
ul.flow-list {list-style: none}
.flow-item {padding-block: .85rem; border-top: 1px solid var(--line)}
.flow-item-question, .flow-answer {margin-bottom: .32rem}
.flow-answer {font-weight: 650; color: var(--accent)}
.flow-revisao ol {margin-top: 1rem}
dialog {padding: 0; width: min(33rem,calc(100% - 1.7rem)); max-width: none; max-height: 90vh; max-height: 90dvh; border: 1px solid var(--edge); border-radius: 1rem; background: var(--bg); color: var(--ink); overflow: auto}
dialog::backdrop {background: rgb(15 24 20 / .58)}
.dialog-head, .dialog-foot {padding: 1.1rem 1.35rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem}
.dialog-head {border-bottom: 1px solid var(--line)}
.dialog-head h2 {margin: 0; font-size: 1.75rem}
.close {font-size: 1.65rem; color: var(--accent)}
.dialog-body {padding: 1.15rem 1.35rem}
.dialog-body fieldset {border: 0; margin: 0 0 1rem; min-width: 0; padding: 0}
.dialog-body legend {padding: 0; margin-bottom: .4rem; font-weight: 650; max-width: 100%; overflow-wrap: anywhere}
.choices {display: flex; gap: .45rem; flex-wrap: wrap}
.choices label {font-size: .91rem; padding: .48rem .65rem}
.choices label, .check-pref {min-width: 0; max-width: 100%; overflow-wrap: anywhere}
.hint {margin: 0; color: var(--soft); font-size: .88rem}
.dialog-foot {border-top: 1px solid var(--line)}

:root[data-espacamento="amplo"] :is(.hero h1, .brand span, .overview strong) {
  letter-spacing: var(--tracking); word-spacing: var(--word-gap); line-height: 1.3;
}
:root[data-tamanho="maior"] .hero h1 {overflow-wrap: anywhere}

@media (max-width: 52em) {
  .header-inner {gap: .55rem 1.2rem}
  .header-inner nav {gap: .9rem}
  .hero {gap: 1.55rem}
  .overview li {gap: .6rem; flex-direction: column; padding: .9rem}
  .overview strong {font-size: 1.2rem}
}
@media (max-width: 42em) {
  .header-inner {display: grid; grid-template-columns: minmax(0,1fr) auto; padding-block: .65rem .2rem; gap: .15rem .6rem}
  .header-inner nav {grid-row: 2; grid-column: 1/-1}
  .settings-trigger {grid-row: 1; grid-column: 2}
  .brand span {font-size: 1.4rem}
  .hero {grid-template-columns: 1fr; padding: 1.75rem 0 1.25rem; gap: 1.3rem}
  .hero h1 {font-size: clamp(2.25rem,9.8vw,3.7rem); overflow-wrap: anywhere}
  .how {padding-block: 1.4rem}
  .overview, .home-notes {grid-template-columns: minmax(0,1fr)}
  .overview {padding: 0; gap: .65rem}
  .overview li {padding: .9rem; gap: .75rem; flex-direction: row}

  .home-notes {gap: 1.2rem; padding-block: 1.7rem}
  .home-notes > section + section {border-top: 1px solid var(--line); padding-top: 1.3rem}
  .footer-inner {align-items: start}
}
@media (max-width: 30em) {
  .frame, .reading-page, .flow-page {width: calc(100% - 2rem)}
  .header-inner {display: flex; justify-content: space-between; align-items: center; gap: .2rem .45rem}
  .header-inner nav {order: 3; flex-basis: 100%; gap: .8rem}
  .brand {margin: 0}
  .brand img {width: 1.6rem}
  .settings-trigger {padding-inline: .5rem}
  .hero-actions {gap: .25rem .9rem}
  .flow-counts {grid-template-columns: 1fr}
  .flow-counts div {flex-direction: row-reverse; justify-content: flex-end; align-items: baseline; gap: .75rem; padding: .7rem 1rem}
  .flow-counts div + div {border: 0; border-top: 1px solid var(--line)}
  .answer-row {flex-wrap: wrap}
  .flow-tag {margin-left: 0}
  .dialog-body, .dialog-foot, .dialog-head {padding-inline: .9rem}
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {scroll-behavior: auto !important; animation: none !important; transition: none !important}
}
@media (forced-colors: active) {
  :root {--ink: CanvasText; --bg: Canvas; --focus: Highlight; --accent: LinkText; --line: CanvasText; --edge: ButtonText}
  main:has(.home)::before, .eyebrow::before {display: none}
  .icon-tile {border: 1px solid CanvasText}
  button, .answer-row, .choices label {border: 1px solid ButtonText}
  button.button-primary:not(:disabled) {
    forced-color-adjust: none; color: HighlightText; background: Highlight; border: 2px solid ButtonText;
  }
  button.button-primary:focus-visible {box-shadow: 0 0 0 3px Canvas}
  :focus-visible {outline: 3px solid Highlight !important}
  :checked {outline: 1px solid Highlight}
  .flow-progress {appearance: auto}
}

#atelier {
  --atelier-ink: #172c51;
  --atelier-line: #58739e;
  --atelier-sky: #f1f6ff;
  --atelier-cloud: #fff;
  --atelier-ground: #e8effc;
  --atelier-btn: #fff;
  --atelier-active: #e2edff;
  --atelier-action: #1949ae;
  --atelier-focus: #ffe36c;
  --atelier-inset: clamp(.55rem, 2.3vw, .9rem);
  width: 100%;
  color: var(--atelier-ink);
  background: linear-gradient(160deg, var(--atelier-cloud), var(--atelier-sky) 48%, var(--atelier-ground));
  border: 1px solid var(--atelier-line);
  border-radius: 1rem;
  box-shadow: 0 1rem 2.6rem rgb(10 25 59 / .12);
  overflow-wrap: anywhere;
}

.atelier-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .2rem .65rem;
  padding: .4rem var(--atelier-inset);
  border-bottom: 1px solid var(--line);
}

.atelier-name {
  display: flex;
  flex-direction: column;
  gap: .32rem;
  color: var(--atelier-ink);
  margin: .36rem 0;
  font: inherit;
  font-weight: 720;
  line-height: 1.22;
}

.atelier-name::before {
  content: "";
  width: 2.45rem;
  max-width: 100%;
  height: 3px;
  border-radius: 9px;
  background: var(--signal-gradient, linear-gradient(90deg, #2384ff, #22b287, #ffcc42, #fa4e64));
}

.atelier-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  max-width: 100%;
}

.atelier-body {
  display: grid;
  gap: .62rem;
  padding: .68rem var(--atelier-inset) .45rem;
}

.atelier-mode, .atelier-tools, .atelier-extra-opcoes {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: .4rem;
}

.atelier-mode > button {flex: 1 1 auto}
.atelier-tools > button {flex: 1 1 auto}
.atelier-stage {margin: 0}

.atelier-visor {
  position: relative;
  border: 1px solid #7395c6;
  border-radius: .55rem;
  color: #ecf5ff;
  background: #061127;
  overflow: clip;
}

.atelier-visor::before, .atelier-visor::after {
  content: "";
  position: absolute;
  z-index: 1;
  width: .72rem;
  height: .72rem;
  border: solid #8abaff;
  pointer-events: none;
}

.atelier-visor::before {
  inset: .38rem auto auto .38rem;
  border-width: 1px 0 0 1px;
  border-top-left-radius: .13rem;
}

.atelier-visor::after {
  inset: auto .38rem .38rem auto;
  border-width: 0 1px 1px 0;
  border-bottom-right-radius: .13rem;
}

.atelier-visor canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1.55;
  cursor: grab;
  touch-action: pan-y pinch-zoom;
}

.atelier-visor canvas[data-arrastando] {cursor: grabbing}

.atelier-visor canvas:focus-visible {
  outline: 3px solid var(--atelier-focus);
  outline-offset: -6px;
  box-shadow: none;
}

.atelier-caption, .atelier-legenda {
  margin: 0;
  font-size: .86rem;
  line-height: var(--rhythm);
}

.atelier-caption {padding: .55rem .12rem .1rem}
.atelier-legenda {padding: .9rem 1.05rem}

.atelier-extra {
  border-top: 1px solid var(--line);
  color: var(--atelier-ink);
  font-size: .86rem;
}

.atelier-extra summary {
  width: fit-content;
  max-width: 100%;
  padding: .57rem .12rem;
  color: var(--atelier-ink);
  text-underline-offset: .2em;
}

.atelier-extra summary::marker {color: currentColor}
.atelier-extra summary:hover {text-decoration: underline}
.atelier-extra-opcoes {padding-block: .18rem .35rem}

.atelier-extra-opcoes label {
  display: flex;
  align-items: center;
  gap: .45rem;
  min-height: 44px;
  padding: .34rem .52rem;
  max-width: 100%;
  border: 1px solid var(--atelier-line);
  border-radius: .42rem;
  cursor: pointer;
  background: var(--atelier-btn);
}

.atelier-extra-opcoes input {
  flex: none;
  width: 1rem;
  height: 1rem;
  margin: 0;
  accent-color: var(--atelier-action);
}

.atelier button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .37rem;
  min-height: 44px;
  min-width: 44px;
  max-width: 100%;
  padding: .4rem .54rem;
  border: 1px solid var(--atelier-line);
  border-radius: .42rem;
  color: var(--atelier-ink);
  background: var(--atelier-btn);
  font: inherit;
  font-size: .84rem;
  font-weight: 570;
  line-height: var(--rhythm);
  letter-spacing: inherit;
  word-spacing: inherit;
}

.atelier button svg {flex: none}
.atelier button:hover {text-decoration: underline; text-underline-offset: .2em}
.atelier-head button {background: transparent}

.atelier-mode button[aria-pressed="true"] {
  border-color: var(--atelier-action);
  box-shadow: inset 0 -3px var(--atelier-action);
  background: var(--atelier-active);
  color: var(--atelier-action);
  font-weight: 720;
}

.atelier button.atelier-signal {
  border-color: var(--atelier-action);
  background: var(--atelier-active);
  color: var(--atelier-action);
  font-weight: 720;
}

.atelier button:focus-visible, .atelier summary:focus-visible, .atelier input:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.atelier-mode button[aria-pressed="true"]:focus-visible {
  box-shadow: inset 0 -3px var(--atelier-action), 0 0 0 2px var(--atelier-sky);
}

@media (prefers-color-scheme: dark) {
  :root:is(:not([data-tema]), [data-tema="sistema"]) #atelier {
    --atelier-ink: #eff4ff;
    --atelier-line: #8ba6d3;
    --atelier-sky: #101d36;
    --atelier-cloud: #172844;
    --atelier-ground: #0d172a;
    --atelier-btn: #13233d;
    --atelier-active: #21395c;
    --atelier-action: #a2d8ff;
  }
}

:root[data-tema="escuro"] #atelier {
  --atelier-ink: #eff4ff;
  --atelier-line: #8ba6d3;
  --atelier-sky: #101d36;
  --atelier-cloud: #172844;
  --atelier-ground: #0d172a;
  --atelier-btn: #13233d;
  --atelier-active: #21395c;
  --atelier-action: #a2d8ff;
}

:root[data-tema="contraste"] #atelier {
  --atelier-ink: #fff;
  --atelier-line: #fff;
  --atelier-sky: #101010;
  --atelier-cloud: #101010;
  --atelier-ground: #101010;
  --atelier-btn: #101010;
  --atelier-active: #101010;
  --atelier-action: #fff;
  --atelier-focus: #ffde70;
  background: var(--atelier-ground);
  box-shadow: none;
}

:root[data-tema="contraste"] .atelier-visor {
  border-color: var(--atelier-line);
  color: var(--atelier-ink);
  background: var(--atelier-ground);
}

:root[data-tema="contraste"] .atelier-name::before,
:root[data-tema="contraste"] .atelier-visor::before,
:root[data-tema="contraste"] .atelier-visor::after {display: none}

@media (forced-colors: active) {
  #atelier, :root[data-tema="contraste"] #atelier {
    background: Canvas;
    color: CanvasText;
    border: 1px solid CanvasText;
    box-shadow: none;
  }
  .atelier-visor, :root[data-tema="contraste"] .atelier-visor {
    background: Canvas;
    color: CanvasText;
    border-color: CanvasText;
  }
  .atelier button, .atelier button.atelier-signal, .atelier-extra-opcoes label {
    background: ButtonFace;
    color: ButtonText;
    border-color: ButtonText;
  }
  .atelier-mode button[aria-pressed="true"] {
    forced-color-adjust: none;
    background: Highlight;
    color: HighlightText;
    border: 1px solid ButtonText;
  }
  .atelier-name::before, .atelier-visor::before, .atelier-visor::after {display: none}
}

/* Todas as superfícies da rodada usam as mesmas cores e preferências da página. */
.flow-page {
  width: min(calc(100% - 2rem), 43rem);
  margin: clamp(1.55rem, 4vw, 3.6rem) auto clamp(2rem, 5vw, 4.6rem);
  color: var(--ink);
}
.flow-page, .flow-page * {overflow-wrap: anywhere}
.flow-page > :last-child, .flow-page .flow-heading > :last-child {margin-bottom: 0}
.flow-page .flow-heading {margin-bottom: 1.5rem}
.flow-page h1, .flow-page h2 {text-wrap: pretty}
.flow-page h1 {margin: 0 0 .65rem}
.flow-lead {max-width: 56ch; color: var(--soft); margin: 0; font-size: 1.08rem}
.flow-page .flow-note {max-width: 62ch}
.flow-page .flow-callout, .flow-page .flow-error {
  border: 0;
  border-inline-start: 3px solid var(--accent);
  border-radius: 0 .45rem .45rem 0;
  margin-block: 1.15rem;
  padding: .9rem 1.05rem;
  color: var(--ink);
  background: var(--wash);
}
.flow-page .flow-error {border: 2px solid var(--focus); border-radius: .45rem; font-weight: 650}
.flow-page .flow-actions {display: flex; flex-wrap: wrap; align-items: center; gap: .65rem 1rem; margin: 1.1rem 0}
.flow-page .flow-actions > * {max-width: 100%}
.flow-page .flow-help {margin: 1rem 0; border: 0; border-block: 1px solid var(--line); border-radius: 0; background: transparent}
.flow-page .flow-help summary {padding: .7rem 0; color: var(--accent); font-size: .95rem; cursor: pointer}
.flow-page .flow-help p {margin: .25rem 0 1rem; max-width: 59ch}
.flow-check {display: flex; align-items: center; gap: .65rem; min-height: 44px; max-width: 100%; width: fit-content; cursor: pointer}
.flow-start {margin-block: 1.4rem}
.flow-check input, .answer-row input {flex: none; margin: 0; width: 1rem; height: 1rem; accent-color: var(--accent)}
.flow-start .flow-check {font-weight: 650}

.flow-pergunta {max-width: 40rem}
.flow-topline {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: .5rem 1rem;
  margin: 0 0 clamp(1.1rem, 2.4vw, 1.7rem);
}
.flow-pergunta .flow-topline h1 {
  margin: 0; font: inherit; font-weight: 720; letter-spacing: inherit;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.flow-topline .flow-meta {margin: 0; font-size: .92rem; font-weight: 550; color: var(--soft); letter-spacing: inherit}
.flow-topline .flow-progress {
  appearance: none; flex: 0 0 100%; display: block; width: 100%; height: .36rem;
  border: 1px solid var(--edge); border-radius: 1rem; overflow: hidden;
  margin: .2rem 0 0; color: var(--accent); background: var(--bg);
}
.flow-progress::-webkit-progress-bar {background: var(--bg)}
.flow-progress::-webkit-progress-value {background: var(--accent)}
.flow-progress::-moz-progress-bar {background: var(--accent)}
.flow-page .flow-intro {font-size: 1rem; color: var(--soft); max-width: 58ch; margin: 0 0 .65rem}
.flow-pergunta .flow-form {margin-block: 0}
.flow-question {border: 0; min-inline-size: 0; margin: 0; padding: 0}
.flow-question legend {
  padding: 0; margin: 0 0 1.1rem;
  max-inline-size: 100%; font-size: clamp(1.45rem, 2.85vw, 2.05rem); line-height: 1.25;
  font-family: inherit; font-weight: 630; letter-spacing: -.025em; text-wrap: pretty;
}
.flow-pergunta .answer-options {display: grid; grid-template-columns: minmax(0,1fr); gap: .4rem}
.flow-page .answer-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: .25rem .75rem;
  padding: .51rem .95rem; min-height: max(44px, 2.7rem);
  border: 1px solid var(--edge); border-radius: .48rem;
  color: var(--ink); background: var(--paper); cursor: pointer;
}
.answer-text {flex: 1 1 10ch; min-width: 0}
.flow-page .answer-row:has(:checked) {
  border-color: var(--accent); background: var(--selection, var(--wash));
  box-shadow: inset 0 0 0 1px var(--accent);
}
.flow-page .answer-row:has(:focus-visible), .flow-page .flow-check:has(:focus-visible) {
  outline: 3px solid var(--focus); outline-offset: 3px; box-shadow: 0 0 0 3px var(--bg);
}
.flow-page .flow-tag {margin: 0; color: var(--accent); font-size: .8rem; font-weight: 680}
.flow-page .flow-step-controls {margin: 1rem 0 .9rem}
.flow-step-controls > :last-child {margin-inline-start: auto}
@media (hover: hover) {
  .flow-page .answer-row:hover {border-color: var(--accent)}
}

.flow-counts {
  display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
  margin: 1.3rem 0; padding: 0;
  border: 1px solid var(--line); border-radius: .65rem; background: var(--paper);
}
.flow-counts > div {
  display: flex; flex-direction: column-reverse; justify-content: end; align-items: start;
  gap: .4rem; min-width: 0; padding: clamp(.85rem, 2.4vw, 1.3rem);
}
.flow-counts > div + div {border-inline-start: 1px solid var(--line)}
.flow-counts dd {
  color: var(--accent); font-family: inherit; font-size: clamp(1.9rem, 3.2vw, 2.6rem);
  font-weight: 600; letter-spacing: -.04em; line-height: 1; margin: 0; font-variant-numeric: tabular-nums;
}
.flow-counts dt, .flow-page .flow-subtle {color: var(--soft); font-size: .92rem}
.flow-section {margin-block: 2rem 1.5rem; border-top: 1px solid var(--line); padding-top: 1.45rem}
.flow-devolutiva > h2, .flow-exemplos-consulta > h2, .flow-consulta > h2:first-child {margin-top: 0}
.flow-exemplos {list-style: none; margin: .75rem 0 1.05rem; padding: 0}
.flow-exemplos li + li {border-top: 1px solid var(--line)}
.flow-exemplos li {padding-block: .6rem}
.flow-exemplos li p {margin: 0 0 .2rem}
.flow-exemplos strong {color: var(--accent)}
.flow-consulta .flow-actions > a {display: inline-flex; align-items: center; min-height: 44px; min-width: 44px}
.flow-page ul.flow-list {list-style: none; margin: 0; padding: 0 1rem}
.flow-item {border-top: 1px solid var(--line); padding-block: .85rem}
.flow-item .flow-item-question {margin: 0 0 .18rem}
.flow-item .flow-answer {font-weight: 650; color: var(--accent); margin-bottom: .22rem}
.flow-item .flow-check {font-size: .93rem}
.flow-consulta {
  border: 1px solid var(--line); border-inline-start: 3px solid var(--accent);
  padding: clamp(.9rem, 2.4vw, 1.5rem); border-radius: .5rem; background: var(--paper); margin: 1.6rem 0;
}
.flow-consulta .flow-actions {margin-bottom: 0}
.flow-revisao ol {padding-inline-start: 1.75rem; margin-block: 1rem}
.flow-revisao li::marker {color: var(--accent); font-weight: 650}
.flow-revisao .flow-item > button {margin-top: .2rem}
:root[data-espacamento="amplo"] .flow-question legend {
  line-height: 1.53; letter-spacing: var(--tracking); word-spacing: var(--word-gap);
}

@media (max-width: 32em) {
  .flow-page {width: calc(100% - min(2rem,10vw))}
  .flow-topline {justify-content: flex-start}
  .flow-topline .flow-meta {flex-basis: 100%}
  .flow-page .answer-row {padding-inline: .66rem}
  .flow-page .answer-row:has(:checked) .flow-tag {flex-basis: 100%; padding-inline-start: 1.75rem}
  .flow-step-controls > :last-child {margin-inline-start: 0}
  .flow-counts {grid-template-columns: minmax(0,1fr)}
  .flow-counts > div {flex-direction: row-reverse; align-items: baseline; justify-content: flex-end; gap: .75rem}
  .flow-counts > div + div {border: 0; border-top: 1px solid var(--line)}
  .flow-counts dd {min-inline-size: 1.35em}
}
@media (forced-colors: active) {
  .flow-page .flow-progress {appearance: auto}
  .flow-page .answer-row, .flow-page .flow-consulta {border: 1px solid ButtonText}
  .flow-page .answer-row:has(:checked) {border: 2px solid Highlight}
}

.journey {
  min-inline-size: 0;
  margin-block: 1rem 1.25rem;
  padding: clamp(.65rem, 2.5vw, 1rem);
  border: 1px solid var(--line);
  border-radius: .72rem;
  background: var(--paper);
}

.journey-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: .2rem .75rem;
  margin-block-end: .62rem;
}

.journey-header > * {margin: 0}
.journey-header :is(h2, h3) {
  color: var(--ink);
  font-size: 1rem;
  font-weight: 720;
  letter-spacing: inherit;
  line-height: 1.3;
}

.journey-caption {
  margin: .65rem 0 0;
  color: var(--soft);
  font-size: .89rem;
  line-height: var(--rhythm);
}

.journey-header .journey-caption {margin: 0}

.journey-completion {
  width: fit-content;
  margin: .1rem 0 .55rem;
  padding: .22rem .55rem;
  border-inline-start: 3px solid var(--signal-green);
  border-radius: 0 .28rem .28rem 0;
  color: var(--ink);
  background: var(--wash);
  background: color-mix(in srgb, var(--signal-green) 12%, var(--paper));
  font-size: .89rem;
  font-weight: 690;
}

.journey-route {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: clamp(4px, 1vw, .42rem);
  list-style: none;
  margin: 0;
  padding: 0;
}

.journey-route > li {
  display: grid;
  place-items: center;
  min-inline-size: 0;
  min-block-size: 1.75em;
  padding-block: .12rem;
  border: 1px dashed var(--edge);
  border-radius: 1em;
  color: var(--soft);
  font-size: .91rem;
  line-height: 1.4;
}

.journey-step-number {
  font-weight: 690;
  font-variant-numeric: tabular-nums;
}

.journey-route > [data-state="complete"] {
  border-style: solid;
  color: var(--ink);
  background: var(--wash);
  background: color-mix(in srgb, var(--signal-green) 11%, var(--paper));
}

.journey-route > [data-state="current"] {
  border-color: var(--accent);
  border-style: solid;
  box-shadow: inset 0 0 0 1px var(--accent);
  color: var(--on-accent);
  background: var(--accent);
}

.mapa-resultado {
  min-inline-size: 0;
  margin-block: 1.55rem;
  padding: clamp(.75rem, 3vw, 1.35rem);
  border: 1px solid var(--line);
  border-radius: .72rem;
  background: var(--paper);
}

.mapa-resultado > :first-child {margin-block-start: 0}
.mapa-resultado > :last-child {margin-block-end: 0}
.mapa-resultado > h2 {font-size: clamp(1.42rem, 3.2vw, 1.9rem); line-height: 1.2}

.mapa-controles {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .38rem;
  margin-block: .85rem 1rem;
}

.mapa-controles button,
.mapa-tema-botao {
  min-inline-size: 44px;
  min-block-size: 44px;
  max-inline-size: 100%;
  border: 1px solid var(--edge);
  border-radius: .46rem;
  color: var(--ink);
  background: var(--paper);
  text-align: start;
  overflow-wrap: anywhere;
}

.mapa-controles button {
  padding: .4rem .65rem;
  font-size: .89rem;
}

.mapa-controles button[aria-pressed="true"],
.mapa-tema-botao[aria-expanded="true"] {
  border-color: var(--accent);
  box-shadow: inset 0 -2px var(--accent);
  color: var(--accent);
  background: var(--selection);
  font-weight: 700;
}

:is(.mapa-controles button, .mapa-tema-botao):not(:disabled):hover {text-decoration: underline; text-underline-offset: .17em}
:is(.mapa-controles button, .mapa-tema-botao):focus-visible {box-shadow: 0 0 0 3px var(--bg)}
.mapa-controles button:disabled {border-style: dashed; color: var(--soft); background: var(--wash)}

.mapa-temas {
  display: grid;
  gap: .52rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.mapa-tema {
  min-inline-size: 0;
  border: 1px solid var(--line);
  border-radius: .54rem;
  padding: .4rem;
}

.mapa-tema-botao {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .2rem .6rem;
  inline-size: 100%;
  padding: .55rem 2.04rem .55rem .7rem;
  font-weight: 620;
}

.mapa-tema-botao::before,
.mapa-tema-botao::after {
  content: "";
  position: absolute;
  inset-inline-end: .72rem;
  inset-block-start: 50%;
  inline-size: .62em;
  border-block-start: 2px solid currentColor;
}

.mapa-tema-botao::after {transform: rotate(90deg)}
.mapa-tema-botao[aria-expanded="true"]::after {display: none}

.mapa-contagem {color: var(--soft); font-size: .86em; font-weight: 550}

.mapa-faixa {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
  margin: .42rem 0 0;
  padding: 0;
  list-style: none;
}

.mapa-resultado > .mapa-faixa {margin-block: .6rem .8rem}

.mapa-fase {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;

  max-inline-size: 100%;
  padding: .19rem .42rem;

  background: var(--paper);

  line-height: 1.4;
  overflow-wrap: anywhere;

  background: color-mix(in srgb, var(--signal-blue) 12%, var(--paper));
}

.mapa-fase[data-state="high"] {
  background: var(--wash);
  background: color-mix(in srgb, var(--signal-yellow) 19%, var(--paper));
}

.mapa-fase[data-state="skipped"] {border-style: dashed}

.mapa-faixa[aria-hidden="true"] .mapa-fase {justify-content: center; min-inline-size: 1.68em}

.mapa-detalhe {

  border-block-start: 1px solid var(--line);
  overflow-wrap: anywhere;
}

.mapa-detalhe > :first-child {margin-block-start: 0}
.mapa-detalhe > :last-child {margin-block-end: 0}

.guia-passos {padding-inline-start: 1.4em; margin-block: .75rem 1rem}
.guia-passos > li + li {margin-block-start: .45rem}
.guia-passos > li::marker {color: var(--accent); font-weight: 700}

:root[data-tema="contraste"] :is(.journey-route > [data-state="complete"], .mapa-fase, .journey-completion) {background: var(--paper)}
:root[data-tema="contraste"] .journey-completion {border-color: var(--ink)}

@media (forced-colors: active) {
  .journey-route > [data-state="current"] {outline: 1px solid Highlight; outline-offset: -3px}
  .mapa-controles button[aria-pressed="true"],
  .mapa-tema-botao[aria-expanded="true"] {border-color: Highlight; text-decoration: underline}
}

@media print {
  .journey,
  .mapa-controles {display: none}
}

      <p class="hint">A barra e os marcos da jornada podem ser ocultados. O número da pergunta fica sempre visível.</p>
    </div>
    <div class="dialog-foot"><button class="button-secondary" id="restaurar">Restaurar leitura padrão</button>
      <button class="button-primary" data-close>Concluir ajustes</button></div>
    <p class="sr-only" role="status" id="aviso-ajustes"></p>
  </dialog>
</body>
</html>
