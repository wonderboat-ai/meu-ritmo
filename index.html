  <style>:root {
  color-scheme: light;
  --bg: #F5F8FF; --ink: #101C36; --accent: #1548B8; --on-accent: #FFF;
  --focus: #822769; --paper: #FFFFFF; --wash: #E9F0FE; --line: #C5D2EA;
  --edge: #627497; --soft: #485973; --selection: #E0EAFF;
  --signal-blue: #2D6BFF; --signal-yellow: #FFB522; --signal-red: #F04459; --signal-green: #00BD88;
  --signal-gradient: linear-gradient(90deg, var(--signal-blue), var(--signal-yellow), var(--signal-red), var(--signal-green));
  --grid-line: rgb(37 87 166 / .07); --home-halo: rgb(73 137 236 / .12);
  --soft-shadow: 0 .7rem 2rem rgb(32 64 128 / .08);
  --rhythm: 1.55; --tracking: normal; --word-gap: normal;
  font: 112.5%/var(--rhythm) system-ui, "Segoe UI", sans-serif;
  scroll-padding: 1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]), :root[data-tema="sistema"] {
    color-scheme: dark;
    --bg: #090F21; --ink: #EFF4FF; --accent: #91CEFF; --on-accent: #07162D;
    --focus: #FFE36C; --paper: #111C32; --wash: #192A46; --line: #394F73;
    --edge: #8096BD; --soft: #B4C4DE; --selection: #1D365A;
    --grid-line: rgb(138 194 255 / .08); --home-halo: rgb(40 104 213 / .18);
    --soft-shadow: 0 .7rem 2rem rgb(0 0 0 / .2);
  }
}
:root[data-tema="escuro"] {
  color-scheme: dark;
  --bg: #090F21; --ink: #EFF4FF; --accent: #91CEFF; --on-accent: #07162D;
  --focus: #FFE36C; --paper: #111C32; --wash: #192A46; --line: #394F73;
  --edge: #8096BD; --soft: #B4C4DE; --selection: #1D365A;
  --grid-line: rgb(138 194 255 / .08); --home-halo: rgb(40 104 213 / .18);
  --soft-shadow: 0 .7rem 2rem rgb(0 0 0 / .2);
}
:root[data-tema="contraste"] {
  color-scheme: dark;
  --bg: #101010; --ink: #FFF; --accent: #FFF; --on-accent: #101010;
  --focus: #FFDE70; --paper: #101010; --wash: #101010; --line: #FFF;
  --edge: #FFF; --soft: #FFF; --selection: #101010;
  --signal-gradient: linear-gradient(var(--ink), var(--ink));
  --grid-line: transparent; --home-halo: transparent; --soft-shadow: none;
}
:root[data-tamanho="grande"] {font-size: 137.5%}
:root[data-tamanho="maior"] {font-size: 162.5%}
:root[data-espacamento="amplo"] {--rhythm: 1.84; --tracking: .035em; --word-gap: .08em}
* {box-sizing: border-box}
body {
  margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--ink);
  letter-spacing: var(--tracking); word-spacing: var(--word-gap); overflow-wrap: break-word;
  display: flex; flex-direction: column;
}
:where(main, section, article, div, label) {min-width: 0}
main {flex: 1}
[hidden], #impressao-destaques {display: none !important}
button, select, input {font: inherit; letter-spacing: inherit; word-spacing: inherit}
button {color: inherit; cursor: pointer; white-space: normal; max-width: 100%; line-height: 1.35}
button:disabled {cursor: default; background: var(--wash); color: var(--soft); border-color: var(--edge); border-style: dashed}
a {color: var(--accent)}
a, .text-button, .button-link, .nav-link {text-decoration: underline; text-underline-offset: .22em; text-decoration-thickness: 1px}
:where(a, button, input, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--focus); outline-offset: 3px;
  box-shadow: 0 0 0 3px var(--bg); scroll-margin: 1rem;
}
:where(h1, h2, main)[tabindex="-1"]:focus {outline: none}
:where(h1,h2)[data-page-focus]:focus-visible {outline: 2px solid var(--focus); outline-offset: 5px}
button, summary, .source-list a, .choices label, .check-pref, .answer-row, .flow-check {min-height: 44px}
button, .source-list a, .choices label {min-width: 44px}
button, label, summary {touch-action: manipulation}
.frame {width: min(calc(100% - clamp(2.4rem, 8vw, 8rem)), 69rem); margin-inline: auto}
.skip {position: fixed; z-index: 5; top: 8px; left: 8px; padding: .65rem 1rem; border-radius: .4rem; background: var(--paper); transform: translateY(-180%)}
.skip:focus {transform: none}
.sr-only {position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0}
p {margin: 0 0 1rem; max-width: 62ch}
h1, h2, h3 {line-height: 1.17; overflow-wrap: anywhere}
h1, h2 {font-family: system-ui, "Segoe UI", sans-serif; font-weight: 640; letter-spacing: -.046em}
h3 {font-size: 1.16rem}
h1 {margin: 0 0 1.1rem; font-size: clamp(2.05rem, 4.1vw, 3.3rem)}
h2 {margin: 1.8rem 0 .75rem; font-size: clamp(1.55rem, 3vw, 2.15rem)}
.site-header {border-bottom: 1px solid var(--line); background: var(--paper)}
.header-inner {display: flex; align-items: center; gap: 1.85rem; flex-wrap: wrap; padding-block: .83rem}
.brand, .nav-link, .text-button, .button-link, .close {border: 0; background: none; padding: 0}
.brand {display: inline-flex; align-items: center; gap: .45rem; margin-right: auto; color: var(--ink); text-align: left}
.brand img {flex: none; width: 2.45rem; height: auto}
.brand span, .footer-brand {font: 730 1.58rem/1 system-ui, sans-serif; letter-spacing: -.06em}
.header-inner nav {display: flex; flex-wrap: wrap; gap: 1.55rem; align-items: center}
.nav-link {font-size: .92rem; text-align: left; text-decoration-color: var(--edge)}
.nav-link[aria-current] {font-weight: 650; text-decoration-thickness: 2px; text-decoration-color: var(--accent); color: var(--accent)}
.settings-trigger, .button-primary, .button-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .66rem 1.05rem; font-weight: 650; border-radius: .55rem; border: 1px solid var(--edge);
}
.settings-trigger, .button-secondary {background: transparent; color: var(--accent)}
.settings-trigger {font-size: .9rem; padding: .48rem .86rem; border-radius: .65rem}
.type-icon {font: 600 1.04rem/1 system-ui, sans-serif; letter-spacing: -.065em}
.button-primary {background: var(--accent); color: var(--on-accent); border-color: var(--accent)}
.button-primary:not(:disabled):hover {text-decoration: underline; text-underline-offset: .2em}
.button-secondary:hover, .settings-trigger:hover {background: var(--wash)}
.text-button, .button-link {color: var(--accent); font-weight: 600; text-align: left}
.home {position: relative}
main:has(.home) {position: relative; isolation: isolate}
main:has(.home)::before {
  content: ""; position: absolute; z-index: -1; inset: 0 0 auto; height: min(49rem, 100%);
  background:
    linear-gradient(to bottom, transparent 2rem, var(--bg)),
    radial-gradient(ellipse at 76% 14%, var(--home-halo), transparent 62%),
    repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 3.1rem),
    repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 3.1rem);
  pointer-events: none;
}
.hero {
  display: grid; grid-template-columns: minmax(0,.92fr) minmax(0,1.08fr); align-items: center;
  gap: clamp(1.9rem,4.5vw,4.25rem); padding: clamp(2.3rem,5.3vw,4.8rem) 0 clamp(2.35rem,4.2vw,3.9rem);
}
.eyebrow {
  display: flex; align-items: center; gap: .65rem; color: var(--accent); font-size: .82rem;
  line-height: 1.5; font-weight: 730; letter-spacing: var(--tracking); margin: 0 0 .92rem;
}
.eyebrow::before {content: ""; width: 1.9rem; height: 3px; background: var(--signal-gradient); border-radius: 2px; flex: none}
.hero h1 {
  font-size: clamp(2.55rem,5.45vw,4.75rem); line-height: 1.02; letter-spacing: -.067em;
  font-weight: 740; margin: 0 0 1.2rem; overflow-wrap: normal;
}
.hero h1 em {font-style: normal; color: var(--accent); font-weight: inherit}
.hero-description {max-width: 43ch; color: var(--soft); line-height: var(--rhythm); margin-bottom: 1.48rem}
.hero-actions, .flow-actions, .dialog-foot {display: flex; align-items: center; flex-wrap: wrap; gap: .68rem 1.07rem}
.hero-actions .button-primary {padding: .76rem 1.65rem; border-radius: .65rem; box-shadow: var(--soft-shadow)}
.hero-actions .button-primary:focus-visible {box-shadow: 0 0 0 3px var(--bg)}
.hero-actions .text-button {font-size: .9rem}
.hero-art {position: relative}
.hero-art > [data-voltar-da-pausa] {margin-bottom: .7rem}
.how {border-top: 1px solid var(--line); padding: 1.7rem 0 2.6rem}
.how h2 {font-size: 1.7rem; margin: 0 0 1.12rem}
.overview {margin: 0; padding: 0; list-style: none; display: grid; gap: 1rem; grid-template-columns: repeat(3,minmax(0,1fr))}
.overview li {
  --tile-color: var(--signal-blue);
  min-width: 0; overflow-wrap: anywhere; display: flex; align-items: flex-start; gap: .85rem;
  padding: 1.23rem 1.05rem; border: 1px solid var(--line); background: var(--paper);
  border-radius: .8rem; box-shadow: var(--soft-shadow);
}
.overview li:nth-child(2) {--tile-color: var(--signal-yellow)}
.overview li:nth-child(3) {--tile-color: var(--signal-green)}
.overview strong {display: block; font-weight: 660; font-size: 1.1rem; line-height: 1.3; letter-spacing: -.028em}
.overview li div span {display: block; color: var(--soft); font-size: .9rem; line-height: var(--rhythm); margin-top: .4rem}
.icon-tile {
  flex: none; width: 2.45rem; height: 2.45rem; border-radius: .62rem; display: grid; place-items: center;
  color: var(--ink); background: var(--wash);
  background: color-mix(in srgb, var(--tile-color) 17%, var(--paper));
  border: 1px solid color-mix(in srgb, var(--tile-color) 46%, var(--paper));
}
:root[data-tema="contraste"] .overview .icon-tile {background: var(--paper); color: var(--ink); border: 1px solid var(--ink)}
.home-notes {display: grid; grid-template-columns: 1.08fr 1fr; column-gap: clamp(2rem,6vw,6rem); padding-block: 2rem 2.65rem; border-top: 1px solid var(--line)}
.home-notes h2 {margin: 0 0 .75rem; font-size: 1.4rem}
.home-notes p {margin-bottom: .75rem}
.site-footer {border-top: 1px solid var(--line); color: var(--soft); background: var(--paper)}
.footer-inner {display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; padding-block: .9rem; gap: .5rem 1.3rem}
.footer-brand {font-size: 1.15rem; color: var(--ink); display: inline-flex; align-items: center; gap: .4rem}
.footer-inner > div {display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; align-items: center}
.footer-inner button {font-size: .85rem}
.reading-page, .flow-page {width: min(calc(100% - clamp(2.4rem, 8vw, 8rem)), 42rem); margin: clamp(1.8rem, 4vw, 3.4rem) auto}
.reading-page > .button-secondary {margin-bottom: 1.45rem}
.reading-page > section {border-top: 1px solid var(--line); margin-top: 1.5rem; padding-top: .15rem}
.source-list {padding-left: 1.15rem}
.source-list li + li {margin-top: .3rem}
.source-list a {display: inline-flex; align-items: center; padding-block: .3rem; overflow-wrap: anywhere}
.flow-form {margin-block: 1.3rem}
.flow-actions {margin-block: 1rem}
.flow-help, .flow-group {background: var(--paper); border: 1px solid var(--edge); border-radius: .55rem}
summary {cursor: pointer; color: var(--accent); font-weight: 650; padding: .7rem 1rem}
summary::marker {color: var(--accent)}
.flow-help {margin-block: 1rem}
.flow-help p, .flow-group > p {margin: .65rem 1rem 1rem}
.flow-callout {padding: .95rem 1.15rem; border-left: .24rem solid var(--accent); background: var(--wash); margin-block: 1rem}
.flow-error {background: var(--paper); border: 2px solid var(--focus); border-radius: .4rem; padding: .7rem; font-weight: 650}
.flow-question {border: none; padding: 0; margin: 0; min-width: 0}
.flow-pergunta h1 {font: 650 .96rem/1.5 system-ui, sans-serif; letter-spacing: .012em; margin: 0 0 .6rem}
.flow-progress {display: block; width: 100%; height: .55rem; appearance: none; border: 1px solid var(--edge); border-radius: .4rem; overflow: hidden; color: var(--accent); background: var(--wash); margin: 0 0 1.5rem}
.flow-progress::-webkit-progress-bar {background: var(--wash)}
.flow-progress::-webkit-progress-value {background: var(--accent)}
.flow-progress::-moz-progress-bar {background: var(--accent)}
.flow-meta {font-size: .81rem; color: var(--accent); font-weight: 700; letter-spacing: .045em; margin: 1rem 0 .5rem}
.flow-intro {font-size: .98rem; color: var(--soft); margin-bottom: .25rem}
.flow-question legend {font: 400 clamp(1.55rem, 3vw, 2.15rem)/1.25 Georgia, serif; letter-spacing: -.025em; padding: 0; max-width: 100%; margin-bottom: 1rem}
.answer-options {display: grid; gap: .45rem}
.answer-row, .flow-check, .choices label, .check-pref {display: flex; align-items: center; gap: .65rem; cursor: pointer; text-align: left}
.answer-row, .choices label {padding: .58rem .85rem; border: 1px solid var(--edge); border-radius: .52rem; background: var(--paper)}
.answer-row:has(:checked), .choices label:has(:checked) {background: var(--selection); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent)}
.answer-row:has(:focus-visible), .choices label:has(:focus-visible) {outline: 3px solid var(--focus); outline-offset: 3px}
.answer-row input, .flow-check input, .choices input, .check-pref input {accent-color: var(--accent); width: 1rem; height: 1rem; flex: none; margin: 0}
.flow-tag {margin-left: auto; color: var(--accent); font-size: .81rem; font-weight: 650}
.flow-check {width: fit-content; font-weight: 600}
.flow-counts {display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border: 1px solid var(--line); background: var(--wash); border-radius: .65rem}
.flow-counts div {display: flex; flex-direction: column-reverse; justify-content: start; padding: 1rem}
.flow-counts div + div {border-left: 1px solid var(--line)}
.flow-counts dd {margin: 0; font: 400 2.2rem/1.1 Georgia, serif; color: var(--accent)}
.flow-counts dt, .flow-subtle {color: var(--soft); font-size: .91rem}
.flow-counts dt {min-width: 0; overflow-wrap: anywhere}
.flow-groups {display: grid; grid-template-columns: minmax(0,1fr); gap: .65rem; margin: .5rem 0 1.5rem}
.flow-group {min-width: 0; overflow-wrap: anywhere}
.flow-group summary {border-radius: .55rem}
.flow-group-total {display: inline-block; color: var(--soft); font-weight: 400; font-size: .88rem; margin-left: .65rem}
.flow-list {padding-inline: 1.35rem; margin: 0 0 1rem}
ul.flow-list {list-style: none}
.flow-item {padding-block: .85rem; border-top: 1px solid var(--line)}
.flow-item-question, .flow-answer {margin-bottom: .32rem}
.flow-answer {font-weight: 650; color: var(--accent)}
.flow-revisao ol {margin-top: 1rem}
dialog {padding: 0; width: min(33rem,calc(100% - 1.7rem)); max-width: none; max-height: 90vh; max-height: 90dvh; border: 1px solid var(--edge); border-radius: 1rem; background: var(--bg); color: var(--ink); overflow: auto}
dialog::backdrop {background: rgb(15 24 20 / .58)}
.dialog-head, .dialog-foot {padding: 1.1rem 1.35rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem}
.dialog-head {border-bottom: 1px solid var(--line)}
.dialog-head h2 {margin: 0; font-size: 1.75rem}
.close {font-size: 1.65rem; color: var(--accent)}
.dialog-body {padding: 1.15rem 1.35rem}
.dialog-body fieldset {border: 0; margin: 0 0 1rem; min-width: 0; padding: 0}
.dialog-body legend {padding: 0; margin-bottom: .4rem; font-weight: 650; max-width: 100%; overflow-wrap: anywhere}
.choices {display: flex; gap: .45rem; flex-wrap: wrap}
.choices label {font-size: .91rem; padding: .48rem .65rem}
.choices label, .check-pref {min-width: 0; max-width: 100%; overflow-wrap: anywhere}
.hint {margin: 0; color: var(--soft); font-size: .88rem}
.dialog-foot {border-top: 1px solid var(--line)}

:root[data-espacamento="amplo"] :is(.hero h1, .brand span, .overview strong) {
  letter-spacing: var(--tracking); word-spacing: var(--word-gap); line-height: 1.3;
}
:root[data-tamanho="maior"] .hero h1 {overflow-wrap: anywhere}

@media (max-width: 52em) {
  .header-inner {gap: .55rem 1.2rem}
  .header-inner nav {gap: .9rem}
  .hero {gap: 1.55rem}
  .overview li {gap: .6rem; flex-direction: column; padding: .9rem}
  .overview strong {font-size: 1.2rem}
}
@media (max-width: 42em) {
  .header-inner {display: grid; grid-template-columns: minmax(0,1fr) auto; padding-block: .65rem .2rem; gap: .15rem .6rem}
  .header-inner nav {grid-row: 2; grid-column: 1/-1}
  .settings-trigger {grid-row: 1; grid-column: 2}
  .brand span {font-size: 1.4rem}
  .hero {grid-template-columns: 1fr; padding: 1.75rem 0 1.25rem; gap: 1.3rem}
  .hero h1 {font-size: clamp(2.25rem,9.8vw,3.7rem); overflow-wrap: anywhere}
  .how {padding-block: 1.4rem}
  .overview, .home-notes {grid-template-columns: minmax(0,1fr)}
  .overview {padding: 0; gap: .65rem}
  .overview li {padding: .9rem; gap: .75rem; flex-direction: row}

  .home-notes {gap: 1.2rem; padding-block: 1.7rem}
  .home-notes > section + section {border-top: 1px solid var(--line); padding-top: 1.3rem}
  .footer-inner {align-items: start}
  .flow-group-total {display: block; margin-left: 0}
}
@media (max-width: 30em) {
  .frame, .reading-page, .flow-page {width: calc(100% - 2rem)}
  .header-inner {display: flex; justify-content: space-between; align-items: center; gap: .2rem .45rem}
  .header-inner nav {order: 3; flex-basis: 100%; gap: .8rem}
  .brand {margin: 0}
  .brand img {width: 1.6rem}
  .settings-trigger {padding-inline: .5rem}
  .hero-actions {gap: .25rem .9rem}
  .flow-counts {grid-template-columns: 1fr}
  .flow-counts div {flex-direction: row-reverse; justify-content: flex-end; align-items: baseline; gap: .75rem; padding: .7rem 1rem}
  .flow-counts div + div {border: 0; border-top: 1px solid var(--line)}
  .answer-row {flex-wrap: wrap}
  .flow-tag {margin-left: 0}
  .dialog-body, .dialog-foot, .dialog-head {padding-inline: .9rem}
}
@media (prefers-reduced-motion: reduce) {
